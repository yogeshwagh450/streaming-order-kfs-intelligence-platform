[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderstream-kfs-platform"
version = "0.1.0"
description = "Real-time order streaming platform using Kafka, Flink and Snowflake"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "confluent-kafka[avro]>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "snowflake-connector-python>=3.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "sqlfluff>=3.0",
]

# Flat layout has several top-level dirs; restrict to real Python packages.
[tool.setuptools.packages.find]
include = ["producers*", "consumers*", "flink*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests", "flink/tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["producers", "consumers"]

[tool.sqlfluff.core]
dialect = "snowflake"
templater = "raw"
max_line_length = 100

[tool.sqlfluff.indentation]
tab_space_size = 4
